name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public files
        run: |
          mkdir -p _site/vendor
          cp index.html style.css app.js audio.js _site/
          cp vendor/three.module.min.js vendor/three.core.min.js vendor/three-LICENSE.txt _site/vendor/
          mkdir -p _site/compare
          cp compare/index.html compare/app.js compare/controls.js compare/controls.css _site/compare/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
